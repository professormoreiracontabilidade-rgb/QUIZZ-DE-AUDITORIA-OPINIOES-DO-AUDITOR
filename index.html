<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083b85"><title>Quiz Auditoria • Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf3ff;color:#082650;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{max-width:850px;margin:auto;padding:14px}.card{background:#fff;border-radius:22px;padding:clamp(16px,4vw,34px);box-shadow:0 7px 24px #13376220}.cover{min-height:90dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:18px}.cover h1{font-size:clamp(32px,7vw,56px);line-height:1.13;margin:0;color:#073b87}.cover h2{font-size:clamp(28px,6vw,46px);line-height:1.18;margin:4px 0 18px}.hide{display:none!important}button{cursor:pointer;border:0;border-radius:14px;padding:15px 16px;font:800 clamp(16px,3.6vw,21px) system-ui;min-height:54px;background:#096ac7;color:#fff}button:disabled{opacity:.4;cursor:default}.green{background:#138348}.red{background:#b52c3f}.gray{background:#536b86}.top{background:#073c84;color:#fff;text-align:center;padding:13px}.top b{color:#ffe35a;font-size:clamp(18px,4vw,29px)}.top small{display:block;font-size:clamp(14px,2vw,19px)}.info{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:clamp(15px,3vw,20px);margin:5px 0 10px}progress{width:100%;height:13px;accent-color:#16894e}.question{font-weight:750;font-size:clamp(22px,4.7vw,31px);line-height:1.4;white-space:pre-line;margin:20px 0}.option{display:flex;align-items:flex-start;text-align:left;width:100%;margin:10px 0;background:#f0f6ff;color:#12315c;border:2px solid #c2d3ed;gap:13px;line-height:1.36;padding:18px;font-weight:650;font-size:clamp(18px,3.8vw,24px)}.option .letter{font-weight:900;color:#0562ba;flex-shrink:0}.option.chosen{border-color:#0e60bb;background:#dcecff}.option.good{border-color:#15834a;background:#dcf8e6}.option.bad{border-color:#bf3340;background:#ffe0e3}.option:disabled{opacity:1;cursor:default}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.feedback{margin-top:18px;padding:18px;border-radius:14px;font-size:clamp(18px,3.7vw,23px);line-height:1.5;border:2px solid}.feedback.ok{background:#e2f9e9;border-color:#179653}.feedback.no{background:#ffeaec;border-color:#ce3a46}.feedback p{margin:8px 0 0}.lamp{width:23px;height:23px;border-radius:50%;display:inline-block;margin-right:7px;background:#8490a0;vertical-align:middle}.lamp.ok{background:#15d355;box-shadow:0 0 10px 5px #26ed78,0 0 24px 9px #21d65d99;animation:blink .5s 3}.lamp.no{background:#ef2439;box-shadow:0 0 10px 5px #ff5265,0 0 24px 9px #ed203f88;animation:blink .5s 3}@keyframes blink{50%{opacity:.25}}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.actions button{flex:1 1 150px}.foot{text-align:center;font-size:13px;color:#536882;margin:14px 0}.score{text-align:center;font-size:clamp(21px,4vw,28px)}.label{display:block;font-weight:750;font-size:19px;margin:10px 0 5px}input{width:100%;padding:14px;font-size:21px;border-radius:12px;border:2px solid #a0b5cf}#flash{height:9px;border-radius:8px;margin:8px 0;background:#bac6d3}#flash.ok{background:#00d34d;box-shadow:0 0 16px #10e85a}#flash.no{background:#e6213b;box-shadow:0 0 16px #f12b47}@media(max-width:450px){.row{grid-template-columns:1fr 1fr}.row button:last-child{grid-column:1/-1}}
</style></head><body><header class="top hide" id="head"><b>CURSO DE CONTABILIDADE • PROFESSOR MOREIRA</b><small>TIPOS DE OPINIÃO DO AUDITOR — QUIZ FGV</small></header><main><section class="card cover" id="cover"><h1>Curso de Contabilidade<br>Professor Moreira</h1><h2>Tipos de Opiniões do Auditor<br>50 Questões • FGV</h2><button class="green" id="start">▶ COMEÇAR / CONTINUAR</button></section><section class="card hide" id="quiz"><div class="info"><span id="counter"></span><span id="score"></span></div><progress id="progress" max="50" value="1"></progress><div id="flash"></div><div class="question" id="question"></div><div id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button id="confirm" class="green">✓ CONFIRMAR RESPOSTA</button></div><div class="row"><button id="prev">← VOLTAR</button><button class="green" id="next">AVANÇAR →</button><button class="red" id="reset">↻ REINICIAR</button></div></section><section class="card hide" id="end"><h2>🎓 Revisão concluída!</h2><p class="score" id="result"></p><label class="label" for="name">Nome do aluno (opcional)</label><input id="name" placeholder="Digite seu nome"><div class="actions"><button class="green" id="whats">Enviar resultado ao WhatsApp do professor</button><button id="review">Rever questões</button><button class="red" id="restart2">Reiniciar</button></div></section><p class="foot">Professor Moreira • Auditoria • Revisão CFC / FGV • Progresso salvo neste aparelho</p></main><script>
const QUESTIONS=[{"q":"Ao concluir a auditoria, o auditor obteve evidência apropriada e suficiente e verificou que as demonstrações foram elaboradas, em todos os aspectos relevantes, conforme a estrutura aplicável. Qual opinião emitir?","o":["Opinião sem ressalva.","Opinião com ressalva.","Opinião adversa.","Abstenção de opinião."],"a":0,"e":"A NBC TA 700 prevê opinião não modificada quando as demonstrações estão adequadas, em todos os aspectos relevantes, à estrutura aplicável. Não há fundamento para ressalva, adversa ou abstenção."},{"q":"De acordo com a NBC TA 705, constitui modalidade de opinião modificada:","o":["Opinião sem ressalva.","Parágrafo de ênfase.","Opinião com ressalva.","Parágrafo de outros assuntos."],"a":2,"e":"As opiniões modificadas são: com ressalva, adversa e abstenção. Ênfase e outros assuntos são parágrafos regulados pela NBC TA 706, não tipos de opinião modificada."},{"q":"A principal finalidade da auditoria independente das demonstrações contábeis é:","o":["Garantir a inexistência de fraudes.","Aumentar o grau de confiança dos usuários nas demonstrações contábeis.","Substituir a responsabilidade da administração.","Assegurar lucros nos exercícios seguintes."],"a":1,"e":"Segundo a NBC TA 200, a auditoria eleva a confiança dos usuários por meio da opinião do auditor. Não garante ausência de fraude, lucro futuro nem substitui a administração."},{"q":"Ao emitir opinião não modificada, o auditor comunica que:","o":["Todos os lançamentos foram individualmente examinados.","A entidade não apresenta riscos operacionais.","Não há possibilidade de fraude.","As demonstrações foram elaboradas adequadamente, em todos os aspectos relevantes, conforme a estrutura aplicável."],"a":3,"e":"Opinião sem ressalva refere-se à adequação das demonstrações como conjunto, com materialidade. Não equivale a examinar 100% dos lançamentos nem garantir riscos zero."},{"q":"A empresa apresentou pequenas incorreções. O auditor avaliou os efeitos individuais e acumulados e concluiu que as distorções não corrigidas eram irrelevantes. Com evidências suficientes, qual opinião cabe?","o":["Sem ressalva.","Com ressalva.","Adversa.","Abstenção de opinião."],"a":0,"e":"Distorções irrelevantes, inclusive cumulativamente, não exigem modificar a opinião. A modificação depende de distorções relevantes ou limitações relevantes de evidência."},{"q":"Qual norma estabelece requisitos relativos à formação da opinião e emissão do relatório sobre demonstrações contábeis?","o":["NBC TA 230.","NBC TA 200.","NBC TA 705.","NBC TA 700."],"a":3,"e":"A NBC TA 700 trata da formação da opinião e da emissão do relatório. A TA 705 disciplina modificações; a TA 200, objetivos gerais; a TA 230, documentação."},{"q":"O auditor verificou políticas contábeis apropriadas, divulgações suficientes e ausência de distorções relevantes. Como deve proceder?","o":["Emitir opinião adversa pelos riscos da entidade.","Emitir opinião não modificada.","Abster-se de opinar.","Emitir ressalva devido aos riscos inerentes."],"a":1,"e":"Riscos inerentes não determinam automaticamente modificação da opinião. Evidência suficiente e demonstrações adequadas fundamentam opinião sem ressalva."},{"q":"Em auditoria, “segurança razoável” significa:","o":["Garantia de detecção de todas as fraudes.","Eliminação dos riscos.","Nível elevado de segurança, embora não absoluto.","Dispensa de controles internos pela administração."],"a":2,"e":"Segurança razoável é elevada, mas não absoluta, devido às limitações inerentes da auditoria. Auditoria não garante ausência de fraude."},{"q":"Uma companhia apresenta demonstrações adequadas, mas foram identificadas deficiências de controle interno sem distorções relevantes. O auditor obteve evidência suficiente. Qual opinião cabe?","o":["Necessariamente adversa.","Necessariamente com ressalva.","Abstenção.","Sem ressalva, com comunicação apropriada das deficiências."],"a":3,"e":"Deficiências de controle interno podem exigir comunicação, mas não modificam automaticamente a opinião se não houver distorção relevante ou limitação de evidência."},{"q":"Sobre a opinião sem ressalva, assinale a correta:","o":["Representa uma opinião não modificada.","É opinião modificada.","Significa ausência de testes.","É usada em distorções relevantes e generalizadas."],"a":0,"e":"Sem ressalva é sinônimo de opinião não modificada. Distorções relevantes e generalizadas comprovadas conduzem, em regra, à opinião adversa."},{"q":"Uma empresa não reconheceu provisão relevante. O auditor concluiu que a distorção era relevante, porém não generalizada. Qual opinião cabe?","o":["Sem ressalva.","Adversa.","Com ressalva.","Abstenção."],"a":2,"e":"Distorção comprovada relevante, mas não generalizada, exige opinião com ressalva; adversa requer generalização."},{"q":"O auditor não obteve evidência suficiente de uma conta do ativo. Os possíveis efeitos de distorções não detectadas são relevantes, mas não generalizados. Qual opinião cabe?","o":["Adversa.","Com ressalva.","Sem ressalva.","Abstenção."],"a":1,"e":"Limitação de evidência com possíveis efeitos relevantes e não generalizados leva à ressalva; se fossem generalizados, em regra haveria abstenção."},{"q":"Um investimento foi registrado incorretamente; a distorção é relevante, mas não generalizada. A administração não corrigiu. Qual opinião cabe?","o":["Sem ressalva.","Abstenção.","Adversa.","Com ressalva."],"a":3,"e":"A distorção identificada é relevante e restrita. Por isso o relatório deve conter opinião com ressalva, e não adversa ou abstenção."},{"q":"Segundo a NBC TA 705, a opinião com ressalva é apropriada quando as distorções identificadas são:","o":["Relevantes, mas não generalizadas.","Irrelevantes e generalizadas.","Relevantes e generalizadas.","Inexistentes."],"a":0,"e":"A ressalva é a resposta a distorção relevante sem generalização. Distorção relevante e generalizada comprovada exige opinião adversa."},{"q":"A entidade deixou de depreciar uma máquina, causando distorção relevante no imobilizado e no resultado, mas não generalizada. Qual opinião cabe?","o":["Adversa.","Com ressalva.","Abstenção.","Sem ressalva."],"a":1,"e":"Há distorção contábil relevante, mas localizada, portanto opinião com ressalva. Não é falta de evidência nem efeito generalizado."},{"q":"A empresa impediu procedimentos sobre estoques. Não há procedimentos alternativos, e os possíveis efeitos são relevantes, mas não generalizados. Qual opinião cabe?","o":["Sem ressalva.","Adversa.","Com ressalva.","Abstenção."],"a":2,"e":"A falta de evidência suficiente exige ressalva quando os possíveis efeitos são relevantes, porém não generalizados. A abstenção exige possíveis efeitos generalizados."},{"q":"A opinião com ressalva pode resultar:","o":["De distorção relevante não generalizada ou de falta de evidência com possíveis efeitos relevantes não generalizados.","Exclusivamente da identificação de fraude.","Apenas de distorções generalizadas.","Exclusivamente de continuidade operacional."],"a":0,"e":"A ressalva tem duas origens: distorção conhecida ou limitação na evidência; em ambos os casos os efeitos ou possíveis efeitos são relevantes, mas não generalizados."},{"q":"Ao emitir opinião com ressalva, o auditor inclui uma seção intitulada:","o":["Base para opinião adversa.","Base para abstenção de opinião.","Declaração de inexistência de distorções.","Base para opinião com ressalva."],"a":3,"e":"A seção “Base para opinião com ressalva” explica o assunto que ocasionou a modificação, em conformidade com a NBC TA 705."},{"q":"O auditor encontrou distorção relevante, mas não generalizada, na receita. A administração recusou ajustar. Qual conclusão é correta?","o":["A recusa exige opinião adversa em qualquer caso.","A opinião deve ser modificada com ressalva.","A ausência de ajuste exige abstenção.","Basta comunicar o erro e emitir sem ressalva."],"a":1,"e":"A distorção não corrigida é relevante e não generalizada. Recusa da administração não transforma automaticamente ressalva em adversa."},{"q":"Uma opinião com ressalva indica que:","o":["Todas as demonstrações são inadequadas.","O auditor não formou qualquer conclusão.","Existe assunto relevante que exige modificação, sem efeitos ou possíveis efeitos generalizados.","A empresa não pode continuar atividades."],"a":2,"e":"Ressalva é uma modificação delimitada: efeitos relevantes, mas não generalizados. Não afirma que todo o conjunto está incorreto."},{"q":"Uma controlada substancial não foi consolidada, gerando distorções relevantes e generalizadas comprovadas. Qual opinião cabe?","o":["Sem ressalva.","Adversa.","Com ressalva.","Abstenção."],"a":1,"e":"Omissão substancial de consolidação, com efeitos relevantes e generalizados comprovados, exige opinião adversa."},{"q":"Segundo a NBC TA 705, a opinião adversa é emitida quando o auditor:","o":["Encontra qualquer erro.","Não obtém evidências suficientes.","Verifica falhas administrativas.","Comprova, mediante evidências suficientes, distorções relevantes e generalizadas."],"a":3,"e":"Adversa pressupõe evidência suficiente e distorção relevante e generalizada. Falta de evidência, por outro lado, pode resultar em ressalva ou abstenção."},{"q":"Passivos estão substancialmente subavaliados, com distorções relevantes e generalizadas comprovadas. Qual opinião cabe?","o":["Adversa.","Sem ressalva.","Abstenção.","Com ressalva."],"a":0,"e":"A subavaliação comprovada e generalizada de passivos compromete as demonstrações como conjunto e exige opinião adversa."},{"q":"A entidade adotou práticas contábeis incompatíveis com a estrutura aplicável, com distorções relevantes e generalizadas comprovadas. Qual opinião cabe?","o":["Com ressalva.","Sem ressalva.","Adversa.","Abstenção."],"a":2,"e":"Inadequação contábil relevante e generalizada constatada com evidência suficiente leva à opinião adversa."},{"q":"Qual a principal diferença entre opinião adversa e abstenção?","o":["Na adversa há evidências suficientes das distorções relevantes e generalizadas; na abstenção, em regra, faltam evidências suficientes.","Na adversa não há distorções relevantes.","Na abstenção há sempre fraude comprovada.","Têm o mesmo significado."],"a":0,"e":"Adversa é conclusão desfavorável baseada em evidências; abstenção é a impossibilidade de expressar opinião, normalmente por falta de evidências com possíveis efeitos generalizados."},{"q":"A empresa omitiu obrigações relevantes e generalizadas, comprovadas por evidência suficiente. O auditor deverá:","o":["Emitir sem ressalva.","Emitir com ressalva.","Abster-se.","Emitir opinião adversa."],"a":3,"e":"Distorções conhecidas, relevantes e generalizadas fundamentam opinião adversa, e não abstenção."},{"q":"Qual situação exige opinião adversa?","o":["Erro irrelevante.","Ausência de evidência em conta irrelevante.","Distorções comprovadas, relevantes e generalizadas.","Distorções relevantes, mas não generalizadas."],"a":2,"e":"Somente a alternativa C apresenta distorção comprovada relevante e generalizada, critérios da opinião adversa."},{"q":"As demonstrações não representam adequadamente a posição financeira por distorções relevantes e generalizadas, comprovadas por evidência suficiente. Qual opinião cabe?","o":["Sem ressalva.","Adversa.","Com ressalva.","Abstenção."],"a":1,"e":"Quando a inadequação é comprovada e generalizada, cabe opinião adversa. Abstenção pressupõe impossibilidade de opinar."},{"q":"A opinião adversa caracteriza-se por:","o":["Conclusão desfavorável sobre distorções relevantes e generalizadas.","Indicar somente falta de evidência.","Ser opinião não modificada.","Decorrer de qualquer falha de controle interno."],"a":0,"e":"É uma opinião modificada que conclui pela existência de distorções relevantes e generalizadas; não decorre automaticamente de uma falha de controle."},{"q":"O auditor encontrou erros relevantes e generalizados, não corrigidos, com evidências suficientes. Emitir opinião com ressalva seria:","o":["Obrigatório para qualquer distorção.","Adequado por haver erros.","Necessário só em fraude.","Inadequado: exige-se opinião adversa."],"a":3,"e":"Ressalva pressupõe efeitos não generalizados. Como os erros são relevantes e generalizados, a opinião é adversa."},{"q":"Não foi possível obter evidência suficiente sobre vários saldos relevantes; os possíveis efeitos são relevantes e generalizados. Qual opinião cabe?","o":["Sem ressalva.","Adversa.","Abstenção.","Com ressalva."],"a":2,"e":"Insuficiência de evidência com possíveis efeitos relevantes e generalizados conduz, em regra, à abstenção."},{"q":"Um incêndio destruiu registros substanciais. Não há procedimentos alternativos suficientes, e os possíveis efeitos são relevantes e generalizados. Qual opinião cabe?","o":["Adversa.","Abstenção.","Sem ressalva.","Com ressalva."],"a":1,"e":"Sem evidência suficiente para fundamentar a opinião e com possíveis efeitos generalizados, o auditor se abstém de opinar."},{"q":"A abstenção de opinião caracteriza-se, em regra, por:","o":["Falta de evidência apropriada e suficiente e possíveis efeitos relevantes e generalizados.","Comprovação de que todas as demonstrações estão erradas.","Erros irrelevantes.","Conclusão de apresentação adequada."],"a":0,"e":"O auditor não tem base suficiente para concluir; os possíveis efeitos não detectados podem ser relevantes e generalizados."},{"q":"A administração proibiu acesso a documentos de ativos substanciais. Não houve evidência alternativa; possíveis efeitos relevantes e generalizados. Se permanecer e emitir relatório, qual opinião cabe?","o":["Sem ressalva.","Adversa.","Com ressalva.","Abstenção."],"a":3,"e":"A restrição imposta pela administração pode também envolver avaliação de retirada do trabalho, quando permitida. Se emitir relatório nessas condições, a opinião é de abstenção."},{"q":"A abstenção de opinião significa que:","o":["O auditor comprovou ausência de fraude.","Comprovou distorção generalizada.","Não expressa opinião sobre as demonstrações contábeis.","Aprovou integralmente as demonstrações."],"a":2,"e":"A abstenção é a declaração de que o auditor não expressa opinião. Não significa aprovação nem conclusão adversa comprovada."},{"q":"A companhia não comprovou contas a receber e estoques substanciais. Não houve evidência suficiente; possíveis efeitos relevantes e generalizados. Qual opinião cabe?","o":["Com ressalva.","Abstenção.","Adversa.","Sem ressalva."],"a":1,"e":"A impossibilidade de obter evidência suficiente sobre saldos significativos, com possíveis efeitos generalizados, fundamenta abstenção."},{"q":"Quando possíveis efeitos de falta de evidência são relevantes, o que distingue ressalva de abstenção?","o":["Porte da empresa.","Número de funcionários.","Tempo do contrato.","Generalização dos possíveis efeitos."],"a":3,"e":"Possíveis efeitos relevantes não generalizados: ressalva. Possíveis efeitos relevantes e generalizados: abstenção."},{"q":"A abstenção de opinião NÃO significa necessariamente que:","o":["As demonstrações estejam comprovadamente incorretas.","Haja limitação relevante de evidência no caso usual.","O relatório deva justificar a abstenção.","O auditor considere possíveis efeitos de distorções não detectadas."],"a":0,"e":"Na abstenção não existe, em regra, prova de distorção generalizada; existe insuficiência de evidência que impede emitir opinião."},{"q":"O auditor não conseguiu confirmar informações essenciais sobre parcela substancial das operações; possíveis efeitos relevantes e generalizados. Qual relatório cabe?","o":["Adversa.","Sem ressalva.","Abstenção de opinião.","Com ressalva."],"a":2,"e":"Sem evidências suficientes, com possíveis efeitos relevantes e generalizados, cabe abstenção, não adversa."},{"q":"Sobre adversa e abstenção, assinale a correta:","o":["Ambas não modificadas.","Adversa: distorções comprovadas relevantes e generalizadas; abstenção: em regra, evidências insuficientes com possíveis efeitos relevantes e generalizados.","Ambas exigem fraude.","Abstenção só ocorre com prejuízo."],"a":1,"e":"A distinção central é distorção comprovada versus incapacidade de obter evidência suficiente. Ambas são formas de opinião modificada."},{"q":"Ativo total de R$ 20 milhões; obrigação não registrada de R$ 3 milhões. O auditor julgou a distorção relevante, mas não generalizada. A administração recusou corrigir. Qual opinião?","o":["Adversa.","Sem ressalva.","Abstenção.","Com ressalva."],"a":3,"e":"O valor monetário isolado não define generalização. O enunciado informa que a distorção é relevante e não generalizada: ressalva."},{"q":"A empresa não reconheceu perdas relevantes por impairment em diversas unidades geradoras de caixa; efeitos relevantes e generalizados comprovados. Qual opinião?","o":["Adversa.","Sem ressalva.","Abstenção.","Com ressalva."],"a":0,"e":"O não reconhecimento de perdas com efeitos generalizados e evidências suficientes exige opinião adversa."},{"q":"O auditor não acessou registros de uma filial; procedimentos alternativos insuficientes, possíveis efeitos relevantes, mas não generalizados. Qual opinião?","o":["Adversa.","Abstenção.","Com ressalva.","Sem ressalva."],"a":2,"e":"Falta de evidência com possíveis efeitos relevantes e restritos conduz à opinião com ressalva."},{"q":"Um assunto adequadamente divulgado é de fundamental importância para os usuários. O auditor quer destacá-lo sem modificar a opinião. Qual instrumento usar?","o":["Opinião adversa.","Parágrafo de ênfase.","Abstenção.","Opinião com ressalva."],"a":1,"e":"A NBC TA 706 prevê parágrafo de ênfase para chamar a atenção a assunto adequadamente apresentado ou divulgado e fundamental à compreensão, sem modificar a opinião."},{"q":"Há distorções relevantes e generalizadas por políticas contábeis inadequadas. Um parágrafo de ênfase:","o":["Substitui a opinião adversa.","Elimina a modificação.","Permite opinião sem ressalva.","Não substitui a opinião adversa exigida."],"a":3,"e":"Ênfase nunca substitui modificação de opinião necessária. Com distorções comprovadas relevantes e generalizadas, cabe adversa."},{"q":"Segundo a NBC TA 705, o tipo de opinião modificada depende:","o":["Da natureza do assunto e do julgamento sobre a generalização dos efeitos ou possíveis efeitos.","Apenas do lucro líquido.","Apenas do porte da entidade.","Só da quantidade de testes realizados."],"a":0,"e":"A NBC TA 705 distingue distorção detectada de limitação de evidência e considera relevância e generalização dos efeitos ou possíveis efeitos."},{"q":"Há incerteza relevante quanto à continuidade operacional, adequadamente divulgada, e uso apropriado da base de continuidade. Sem outras causas de modificação, qual relatório cabe?","o":["Necessariamente adversa.","Necessariamente com ressalva.","Opinião não modificada com seção específica sobre a incerteza relevante.","Necessariamente abstenção."],"a":2,"e":"A NBC TA 570 prevê seção “Incerteza relevante relacionada com a continuidade operacional” quando há divulgação adequada e a base é apropriada; a opinião não é modificada apenas por isso."},{"q":"A seção “Base para opinião” tem como finalidade:","o":["Prever lucros.","Apresentar fundamentos da opinião e requisitos aplicáveis.","Substituir notas explicativas.","Expor planejamento tributário."],"a":1,"e":"A seção descreve a base para a opinião e declarações aplicáveis, como observância das normas de auditoria, independência e evidência suficiente, conforme o caso."},{"q":"Na NBC TA 705, efeitos generalizados incluem situações em que as distorções:","o":["Não se restringem a itens específicos, representam parcela substancial ou envolvem divulgações fundamentais.","Afetam necessariamente todas as contas.","São sempre inferiores à materialidade.","Afetam só o ativo."],"a":0,"e":"Generalizado não significa obrigatoriamente todas as contas. Inclui efeitos amplos, substanciais mesmo localizados ou divulgações fundamentais."},{"q":"I. Distorção relevante não generalizada comprovada. II. Distorção relevante e generalizada comprovada. III. Falta de evidência com possíveis efeitos relevantes e generalizados. Qual sequência?","o":["Adversa, ressalva, abstenção.","Sem ressalva, adversa, ressalva.","Ressalva, abstenção, adversa.","Ressalva, adversa, abstenção."],"a":3,"e":"I: ressalva, pois não generalizada. II: adversa, pois a distorção é comprovada e generalizada. III: abstenção, pois falta evidência e os possíveis efeitos são generalizados."}];const KEY='moreira_quiz_auditoria_50_v1',PHONE='5561985323574';let pos=0,answers=Array(50).fill(null),selected=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify({pos,answers,name:$('name').value}))}catch(e){}}try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.answers)&&x.answers.length===50){answers=x.answers.map(n=>Number.isInteger(n)&&n>=0&&n<4?n:null);pos=Math.max(0,Math.min(49,Number(x.pos)||0));$('name').value=x.name||''}}catch(e){}function count(){return answers.filter(n=>n!==null).length}function hits(){return answers.filter((n,i)=>n!==null&&n===QUESTIONS[i].a).length}function sound(good){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A();const beep=(freq,time,dur,type='sine')=>{let o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+time);g.gain.setValueAtTime(.001,c.currentTime+time);g.gain.exponentialRampToValueAtTime(.13,c.currentTime+time+.015);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+time+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+time);o.stop(c.currentTime+time+dur+.02)};if(good){beep(660,0,.17);beep(880,.18,.28)}else{beep(260,0,.27,'sawtooth');beep(180,.28,.33,'sawtooth')}setTimeout(()=>c.close(),1100)}catch(e){}}function render(){const q=QUESTIONS[pos];$('counter').textContent=`QUESTÃO ${pos+1} DE 50`;$('score').textContent=`✓ ${hits()}  •  Respondidas ${count()}`;$('progress').value=pos+1;$('question').textContent=q.q;$('options').replaceChildren();selected=answers[pos];const done=answers[pos]!==null;for(let i=0;i<4;i++){const b=document.createElement('button');b.className='option';if(selected===i)b.classList.add('chosen');if(done&&i===q.a)b.classList.add('good');if(done&&i===answers[pos]&&i!==q.a)b.classList.add('bad');b.disabled=done;b.innerHTML=`<span class="letter">${'ABCD'[i]})</span><span></span>`;b.lastElementChild.textContent=q.o[i];b.addEventListener('click',()=>{selected=i;document.querySelectorAll('.option').forEach((e,j)=>e.classList.toggle('chosen',j===i));$('confirm').disabled=false});$('options').appendChild(b)}$('confirm').disabled=done;$('confirm').classList.toggle('hide',done);$('feedback').className='feedback hide';$('flash').className='';if(done){let ok=answers[pos]===q.a;$('flash').className=ok?'ok':'no';$('feedback').className='feedback '+(ok?'ok':'no');$('feedback').innerHTML=`<strong><span class="lamp ${ok?'ok':'no'}"></span>${ok?'RESPOSTA CORRETA!':'RESPOSTA INCORRETA!'}</strong><p><strong>Gabarito: ${'ABCD'[q.a]} — ${q.o[q.a]}</strong></p><p><strong>Explicação:</strong> ${q.e}</p>`}$('prev').disabled=pos===0;$('next').textContent=pos===49?'VER RESULTADO →':'AVANÇAR →';save();window.scrollTo({top:0,behavior:'instant'})}function showQuiz(){['cover','end'].forEach(x=>$(x).classList.add('hide'));$('head').classList.remove('hide');$('quiz').classList.remove('hide');render()}$('start').onclick=showQuiz;$('confirm').onclick=()=>{if(selected===null||answers[pos]!==null)return;answers[pos]=selected;let ok=selected===QUESTIONS[pos].a;sound(ok);render();document.querySelector('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(answers[pos]===null){alert('Escolha uma alternativa e confirme antes de avançar.');return}if(pos<49){pos++;render()}else{if(count()===50)showEnd();else{let n=answers.findIndex(x=>x===null);pos=n;render();alert('Responda as questões restantes para concluir.')}}};function showEnd(){$('quiz').classList.add('hide');$('end').classList.remove('hide');$('result').textContent=`${hits()} acertos • ${50-hits()} erros • ${Math.round(hits()*2)}% de aproveitamento`;save();window.scrollTo(0,0)}function reset(){if(confirm('Deseja apagar todas as respostas e reiniciar?')){pos=0;answers=Array(50).fill(null);selected=null;save();showQuiz()}}$('reset').onclick=reset;$('restart2').onclick=reset;$('review').onclick=()=>{pos=0;showQuiz()};$('name').oninput=save;$('whats').onclick=()=>{let name=$('name').value.trim()||'Aluno(a)';let t=`Curso de Contabilidade Professor Moreira%0AQuiz Auditoria - 50 questões%0AAluno: ${encodeURIComponent(name)}%0AAcertos: ${hits()}%0AErros: ${50-hits()}%0AAproveitamento: ${hits()*2}%25`;window.open(`https://wa.me/${PHONE}?text=${t}`,'_blank','noopener')};document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hide'))return;if(e.key==='ArrowLeft'&&pos>0){pos--;render()}if(e.key==='ArrowRight'&&answers[pos]!==null)$('next').click()});
</script></body></html>
